name: Auto Generate Ayna Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Private Script Repository
        uses: actions/checkout@v4
        with:
          repository: shakil951/ayna-pvt-code
          token: ${{ secrets.PAT_TOKEN }}
          path: private_script_dir

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Move Script to Root
        run: |
          cp private_script_dir/ayna_auto_scraper.py .
          rm -rf private_script_dir

      - name: Run Ayna Extractor Script
        run: python ayna_auto_scraper.py

      - name: Remove Python Script
        run: rm -f ayna_auto_scraper.py

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add ayna_channels.json ayna_channels.m3u || true
          git commit -m "Auto Update Ayna Playlist: $(TZ='Asia/Dhaka' date +'%Y-%m-%d %r')" || exit 0
          git push
